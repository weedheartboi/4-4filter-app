<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4/4 Filter Pro - Automated Live Betting Manager</title>
    <style>
        :root {
            --bg: #0b0f19;
            --surface: #1e293b;
            --card: #334155;
            --accent: #38bdf8;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #22c55e;
            --blue: #3b82f6;
            --red: #ef4444;
            --amber: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 12px;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
            background: var(--surface);
            padding: 16px;
            border-radius: 14px;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            color: var(--accent);
            margin: 0 0 2px 0;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.75rem;
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Portfolio Grid */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .stat-box {
            background: var(--card);
            padding: 8px 4px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box span {
            display: block;
            font-size: 0.65rem;
            color: var(--muted);
            text-transform: uppercase;
        }

        .stat-box strong {
            font-size: 0.95rem;
            color: var(--text);
        }

        /* Status & Controls Bar */
        .status-bar {
            background: rgba(0,0,0,0.25);
            padding: 8px 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            margin-bottom: 14px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .sync-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            background: var(--green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--green);
        }

        .btn-refresh {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.75rem;
            cursor: pointer;
        }

        /* Race Cards */
        .race-card {
            background: var(--card);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            border-left: 4px solid var(--accent);
            transition: transform 0.2s;
        }

        .race-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .venue {
            font-weight: bold;
            font-size: 0.9rem;
        }

        .timer-badge {
            font-size: 0.75rem;
            color: var(--accent);
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .runner-details {
            font-size: 0.85rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .odds-tag {
            background: #1e293b;
            padding: 2px 8px;
            border-radius: 4px;
            color: var(--green);
            font-weight: bold;
            font-size: 0.8rem;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-pending { background: #475569; color: #cbd5e1; }
        .badge-checking { background: var(--amber); color: #0f172a; }
        .badge-won { background: #065f46; color: #6ee7b7; }
        .badge-loss { background: #7f1d1d; color: #fca5a5; }

        /* Execution Ledger */
        .ledger-section {
            margin-top: 18px;
            border-top: 1px solid #475569;
            padding-top: 12px;
        }

        .ledger-title {
            font-size: 0.85rem;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--accent);
            text-transform: uppercase;
        }

        .ledger-item {
            background: rgba(0,0,0,0.2);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>4/4 Filter Auto-Manager</h1>
        <div class="subtitle">Automated Live Market Feed & Settlement Engine</div>

        <!-- Portfolio Header -->
        <div class="portfolio-grid">
            <div class="stat-box"><span>Bankroll</span><strong id="bankroll">$300.00</strong></div>
            <div class="stat-box"><span>Outlay</span><strong id="outlay">$0.00</strong></div>
            <div class="stat-box"><span>Return</span><strong id="return">$0.00</strong></div>
            <div class="stat-box"><span>Net P/L</span><strong id="net-pl" style="color:var(--green)">$0.00</strong></div>
        </div>

        <!-- Live Sync Control Bar -->
        <div class="status-bar">
            <div class="sync-indicator">
                <div class="pulse-dot"></div>
                <span id="sync-status">Live Market Polling Active</span>
            </div>
            <button class="btn-refresh" onclick="syncLiveFeed()">🔄 Force Sync</button>
        </div>

        <!-- Dynamic Slate -->
        <div id="races-container"></div>

        <!-- Execution Ledger -->
        <div class="ledger-section">
            <div class="ledger-title">Execution History & Settlement Ledger</div>
            <div id="ledger-list" style="max-height: 160px; overflow-y: auto;">
                <div style="color:var(--muted); font-size:0.75rem;">No settled bets recorded yet today.</div>
            </div>
        </div>
    </div>

    <script>
        // Local Device Storage Initialization
        let bankroll = parseFloat(localStorage.getItem('44_bankroll')) || 300.00;
        let totalOutlay = parseFloat(localStorage.getItem('44_outlay')) || 0.00;
        let totalReturn = parseFloat(localStorage.getItem('44_return')) || 0.00;
        let ledger = JSON.parse(localStorage.getItem('44_ledger')) || [];

        // Sample Automated Filtered Feed Baseline (Auto-updated by Serverless Feed)
        let livePicks = JSON.parse(localStorage.getItem('44_live_picks')) || [
            { id: "r1", venue: "The Meadows R1", type: "Greyhound", draw: "Box 1", runner: "Insomniac", startTime: Date.now() - (16 * 60 * 1000), odds: "2.80", status: "Pending", winDiv: 2.80, placeDiv: 1.40, finishPos: 1 },
            { id: "r2", venue: "Capalaba R3", type: "Greyhound", draw: "Box 2", runner: "Speed Dart", startTime: Date.now() + (5 * 60 * 1000), odds: "3.40", status: "Pending", winDiv: 0, placeDiv: 1.60, finishPos: 2 },
            { id: "r3", venue: "Flemington R2", type: "Horse", draw: "Barrier 3", runner: "First Line", startTime: Date.now() + (22 * 60 * 1000), odds: "4.20", status: "Pending", winDiv: 4.20, placeDiv: 1.80, finishPos: 1 },
            { id: "r4", venue: "Randwick R4", type: "Horse", draw: "Barrier 1", runner: "Gate Keeper", startTime: Date.now() + (45 * 60 * 1000), odds: "5.00", status: "Pending", winDiv: 0, placeDiv: 0, finishPos: 5 },
            { id: "r5", venue: "Sandown Park R5", type: "Greyhound", draw: "Box 2", runner: "Shadow Blue", startTime: Date.now() + (70 * 60 * 1000), odds: "2.10", status: "Pending", winDiv: 2.10, placeDiv: 1.20, finishPos: 1 }
        ];

        function saveState() {
            localStorage.setItem('44_bankroll', bankroll);
            localStorage.setItem('44_outlay', totalOutlay);
            localStorage.setItem('44_return', totalReturn);
            localStorage.setItem('44_ledger', JSON.stringify(ledger));
            localStorage.setItem('44_live_picks', JSON.stringify(livePicks));
        }

        function updatePortfolioDisplay() {
            let pl = totalReturn - totalOutlay;
            document.getElementById('bankroll').innerText = '$' + bankroll.toFixed(2);
            document.getElementById('outlay').innerText = '$' + totalOutlay.toFixed(2);
            document.getElementById('return').innerText = '$' + totalReturn.toFixed(2);

            let plElem = document.getElementById('net-pl');
            plElem.innerText = (pl >= 0 ? '+$' : '-$') + Math.abs(pl).toFixed(2);
            plElem.style.color = pl >= 0 ? 'var(--green)' : 'var(--red)';

            renderSlate();
            renderLedger();
        }

        function renderSlate() {
            const container = document.getElementById('races-container');
            container.innerHTML = '';

            if (livePicks.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:var(--muted); font-size:0.8rem; padding:20px;">Searching live Australian markets for 4/4 Filter qualifiers...</div>`;
                return;
            }

            const now = Date.now();

            livePicks.forEach((p, idx) => {
                let diffMins = Math.floor((p.startTime - now) / 60000);
                let timerText = diffMins > 0 ? `Starts in ${diffMins}m` : `Jumped ${Math.abs(diffMins)}m ago`;
                
                let badgeClass = 'badge-pending';
                let statusLabel = p.status;

                if (p.status === 'Settled-Win') { badgeClass = 'badge-won'; statusLabel = 'WON'; }
                else if (p.status === 'Settled-Place') { badgeClass = 'badge-won'; statusLabel = 'PLACED'; }
                else if (p.status === 'Settled-Loss') { badgeClass = 'badge-loss'; statusLabel = 'LOST'; }
                else if (diffMins <= -15 && p.status === 'Pending') { badgeClass = 'badge-checking'; statusLabel = 'AUTO-CHECKING'; }

                container.innerHTML += `
                    <div class="race-card">
                        <div class="race-top">
                            <span class="venue">${p.venue} (${p.type})</span>
                            <span class="badge ${badgeClass}">${statusLabel}</span>
                        </div>
                        <div class="runner-details">
                            <span>Selection: <strong>${p.draw}</strong> - ${p.runner}</span>
                            <span class="odds-tag">$${p.odds}</span>
                        </div>
                        <div style="display:flex; justify-content:space-between; align-items:center; font-size:0.75rem; color:var(--muted);">
                            <span class="timer-badge">${timerText}</span>
                            <span>Stake: $3 Flat ($1W / $2P)</span>
                        </div>
                    </div>
                `;
            });
        }

        function renderLedger() {
            const ledgerCont = document.getElementById('ledger-list');
            if (ledger.length === 0) {
                ledgerCont.innerHTML = `<div style="color:var(--muted); font-size:0.75rem;">No settled bets recorded yet today.</div>`;
            } else {
                ledgerCont.innerHTML = ledger.map(item => `
                    <div class="ledger-item">
                        <span><strong>${item.venue}</strong> (${item.draw}) - ${item.runner}</span>
                        <span style="color:${item.prof >= 0 ? 'var(--green)' : 'var(--red)'}">${item.outcome}: +$${item.ret.toFixed(2)}</span>
                    </div>
                `).join('');
            }
        }

        // Automated 15-Minute Post-Race Settlement Routine
        function runAutoSettlementEngine() {
            const now = Date.now();
            let updated = false;

            livePicks.forEach((p) => {
                let diffMins = (now - p.startTime) / 60000;

                // If race jumped >= 15 mins ago and is still pending, auto-settle
                if (diffMins >= 15 && p.status === 'Pending') {
                    totalOutlay += 3.00;
                    let ret = 0;
                    let outcomeText = '';

                    if (p.finishPos === 1) {
                        ret = p.winDiv + p.placeDiv;
                        p.status = 'Settled-Win';
                        outcomeText = `WIN ($${ret.toFixed(2)})`;
                    } else if (p.finishPos <= 3) {
                        ret = p.placeDiv;
                        p.status = 'Settled-Place';
                        outcomeText = `PLACE ($${ret.toFixed(2)})`;
                    } else {
                        ret = 0;
                        p.status = 'Settled-Loss';
                        outcomeText = 'LOSS ($0.00)';
                    }

                    totalReturn += ret;
                    bankroll = 300.00 - totalOutlay + totalReturn;

                    ledger.unshift({
                        venue: p.venue,
                        draw: p.draw,
                        runner: p.runner,
                        outcome: outcomeText,
                        ret: ret,
                        prof: ret - 3.00
                    });

                    updated = true;
                }
            });

            if (updated) {
                saveState();
                updatePortfolioDisplay();
            }
        }

        // Live Serverless API Hook
        async function syncLiveFeed() {
            document.getElementById('sync-status').innerText = "Syncing live market data...";
            try {
                const res = await fetch('/.netlify/functions/get-races');
                if (res.ok) {
                    const data = await res.json();
                    if (data.picks && data.picks.length > 0) {
                        livePicks = data.picks;
                    }
                }
            } catch (e) {
                console.log("Local offline simulation running.");
            }
            
            runAutoSettlementEngine();
            document.getElementById('sync-status').innerText = "Live Market Synced (" + new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + ")";
            updatePortfolioDisplay();
        }

        // Initialization & Timers
        updatePortfolioDisplay();
        syncLiveFeed();

        // Auto-poll live markets and run post-race settlement checks every 30 seconds
        setInterval(() => {
            runAutoSettlementEngine();
            renderSlate();
        }, 30000);

        setInterval(syncLiveFeed, 120000);
    </script>
</body>
</html>
